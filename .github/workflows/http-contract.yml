name: HTTP contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync Python environment
        run: uv sync --group dev

      - name: Install native search tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find
          mkdir -p "$HOME/.local/bin"
          ln -s "$(command -v fdfind)" "$HOME/.local/bin/fd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Python regressions and contract
        run: |
          uv run pytest -q --durations=15
          uv run ruff check .
          uv run ty check
          uv run pyright

  web-client:
    runs-on: ubuntu-latest
    env:
      YOKE_BROWSER_TEST_OUTPUT: ${{ github.workspace }}/.agents_local/browser-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and Python browser dependencies
        run: |
          python -m pip install uv
          uv sync --group dev

      - name: Validate every Node web script, including assembled inspector views
        run: |
          for script in scripts/test_web_*.mjs; do
            node --experimental-default-type=module "$script"
          done

      - name: Validate Python Chrome fixtures
        run: |
          for script in scripts/test_web_*_browser.py; do
            uv run python "$script"
          done

      - name: Validate TypeScript contract
        working-directory: clients/typescript
        run: |
          npm ci
          npm run check

  session-startup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync Python environment
        run: uv sync --group dev

      - name: Validate Windows CLI imports
        run: uv run python -c "import yoke.cli.main; import yoke.acp.runner; import yoke.daemon.server"

      - name: Validate Windows session startup paths
        run: >-
          uv run pytest -q
          tests/yoke/test_file_io.py
          tests/yoke/test_session_workspace.py
          tests/yoke/bootstrap/test_plugin_loader.py
          tests/yoke/cli/test_prompt_queue_persistence.py
          tests/yoke/cli/test_startup_performance.py
          tests/yoke/http/test_contract.py
          tests/yoke/daemon/test_phase4.py
          tests/yoke/daemon/test_phase4_machine.py
          tests/yoke/daemon/test_portable.py
          tests/yoke/daemon/test_client_review.py
          tests/yoke/daemon/test_identity.py
          tests/yoke/cli/test_review_entrypoints.py
          tests/yoke/daemon/test_listeners.py
          tests/yoke/daemon/test_windows_process.py
          tests/yoke/cli/test_headless_client.py
          tests/yoke/daemon/test_capability_tcp.py
