name: HTTP contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync Python environment
        run: uv sync --group dev

      - name: Validate HTTP Python contract
        run: |
          uv run pytest -q tests/yoke/http
          uv run ruff check src/yoke/http tests/yoke/http scripts/generate_http_openapi.py
          uv run pyright src/yoke/http tests/yoke/http
