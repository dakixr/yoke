name: HTTP contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync Python environment
        run: uv sync --group dev

      - name: Install native search tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find
          mkdir -p "$HOME/.local/bin"
          ln -s "$(command -v fdfind)" "$HOME/.local/bin/fd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Python regressions and contract
        run: |
          uv run pytest -q
          uv run ruff check .
          uv run ty check
          uv run pyright

  web-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Validate browser behavior
        run: node --experimental-default-type=module scripts/test_web_optimistic_updates.mjs

      - name: Validate TypeScript contract
        working-directory: clients/typescript
        run: |
          npm ci
          npm run check

  session-startup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync Python environment
        run: uv sync --group dev

      - name: Validate Windows session startup paths
        run: >-
          uv run pytest -q
          tests/yoke/bootstrap/test_plugin_loader.py
          tests/yoke/cli/test_session_index_cache.py
          tests/yoke/cli/test_prompt_queue_persistence.py
          tests/yoke/cli/test_startup_performance.py
          tests/yoke/http/test_contract.py
