[project]
name = "yoke"
version = "1.11.2"
description = "Native Python coding agent CLI and SDK."
readme = "README.md"
authors = [
    { name = "dakixr", email = "dakixr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "grok-mermaid-python @ git+https://github.com/dakixr/grok-mermaid-python.git@113bf4d8c7565256f887eed7ddab0895385b285e",
    "markitdown[pdf]>=0.1",
    "mcp>=2,<3",
    "pillow>=10",
    "prompt-toolkit>=3.0",
    "pydantic>=2",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.30",
    "websockets>=15",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
]

[project.scripts]
yoke = "yoke.cli.main:main"
yoke-mcp = "yoke.mcp_server.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=7.4",
    "ruff>=0.8",
    "ty>=0.0.1a0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["src"]
include = ["src/yoke", "tests"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
