[project]
name = "yoke"
version = "3.35.0"
description = "Native Python coding agent CLI and SDK."
readme = "README.md"
authors = [
    { name = "dakixr", email = "dakixr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "grok-mermaid-python @ git+https://github.com/dakixr/grok-mermaid-python.git@113bf4d8c7565256f887eed7ddab0895385b285e",
    "markitdown[pdf]>=0.1",
    "mcp>=2.2,<3",
    "pillow>=13",
    "prompt-toolkit>=3.0",
    "pydantic>=2",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.41.0",
    "websockets>=15",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "agent-client-protocol==0.12.1",
]

[project.scripts]
yoke = "yoke.cli.main:main"
yoke-mcp = "yoke.mcp_server.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pyright>=1.1",
    "pytest>=7.4",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "ty>=0.0.1a0",
]

[tool.pytest.ini_options]
addopts = "-n 6 --dist loadgroup"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
# Do not resolve transitive dependencies below their patched releases.
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.18",
    "cryptography>=50",
    "opentelemetry-api>=1.45.1",
    "pyjwt>=2.15",
    "soupsieve>=2.9",
    "urllib3>=2.8",
]

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["src"]
include = ["src/yoke", "tests"]

[tool.ty.environment]
# The skill folder is data, while its scripts form a standalone Python package.
root = ["src", ".", "src/yoke/agent/skills/built_in/yoke-subagents"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
